<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Senior Tech</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #1f2937;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 560px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      label {
        font-weight: 600;
      }
      input, button {
        padding: 0.8rem 1rem;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
      }
      button {
        background: #facc15;
        border: none;
        cursor: pointer;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Contact Senior Tech</h1>
      <p>Leave your details and we will be in touch.</p>

      <form name="contact" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact" />
        <input type="hidden" name="bot-field" />

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" required />

        <label for="bestTime">Best Time to Call</label>
        <input id="bestTime" name="bestTime" type="text" placeholder="Morning / Afternoon / Evening" required />

        <button type="submit">Request a Call</button>
      </form>
    </div>
  </body>
</html>
